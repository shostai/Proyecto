        <header>
            <h1>Registro de <br> 
                Administradores</h1>
            <section>
                <form id="signupAdminForm">
                    <label for="name">Nombre</label>
                    <input type="text" placeholder="Nombre completo" id="name" required autofocus>
                    
                    <label for="email">Mail</label>
                    <input type="email" placeholder="Correo electrónico" id="email" required>
                    
                    <label for="password">Contraseña</label>
                    <input type="password" placeholder="Contraseña" id="password" required>
                    
                    <input type="submit" value="Registrar Administrador">
                </form>
            </section>
        </header>

        <img class="img1" src="/img/freepik_br_603e5106-e927-4b47-972b-a585ccb1cfd4.png" alt="Imagen Biblioteca">
